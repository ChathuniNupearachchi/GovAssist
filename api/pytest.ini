[pytest]
markers =
    real_api: exercises a real external LLM API call (Claude, Gemini, or
        a RAGAS-style judge) — costs real API budget and is not fully
        deterministic run to run. Skipped by default (see addopts below)
        so the full suite runs free and offline; run deliberately before
        a demo with `pytest -m real_api` (or plain `pytest -m ""` to run
        everything including these). A summary line at the end of every
        default run reports how many were skipped, so the coverage gap
        stays visible rather than silent — see `tests/conftest.py`'s
        `pytest_terminal_summary` hook. See design.md's "Test suite →
        mock external API calls by default" decision
        (langgraph-orchestration-branch).
addopts = -m "not real_api"
